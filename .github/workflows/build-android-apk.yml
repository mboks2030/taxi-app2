name: Build Android APK

# Triggered manually from the GitHub Actions tab
on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'APK version tag (e.g. v1.1.4-debug)'
        required: false
        default: 'v1.1.4-debug'

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout source code
        uses: actions/checkout@v4

      # ── 2. Node.js 18 ────────────────────────────────────────────────────
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # ── 3. Java 17 (required by Gradle / Capacitor) ───────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 4. Android SDK ────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android platform and build-tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      # ── 5. Install npm dependencies ───────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 6. Inject Supabase credentials (from GitHub Secrets) ─────────
      #    Secrets are never printed in logs.
      - name: Create .env from secrets
        shell: bash
        run: |
          printf 'REACT_APP_SUPABASE_URL=%s\n' "${{ secrets.REACT_APP_SUPABASE_URL }}" >> .env
          printf 'REACT_APP_SUPABASE_ANON_KEY=%s\n' "${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}" >> .env

      # ── 7. React production build ─────────────────────────────────────
      - name: Build React production bundle
        shell: bash
        run: npm run build
        env:
          CI: 'false'
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}

      # ── 8. Initialize Capacitor Android platform if absent ────────────
      - name: Initialize Capacitor Android platform
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            echo "android/ directory not found - initializing Capacitor Android platform"
            npx cap add android
          else
            echo "android/ directory already exists - skipping cap add"
          fi

      # ── 9. Sync web build into Android project ────────────────────────
      - name: Sync Capacitor Android
        run: npx cap sync android

      # ── 10. Ensure gradlew is executable ──────────────────────────────
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      # ── 11. Compile debug APK ─────────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        shell: bash
        run: ./gradlew assembleDebug --stacktrace

      # ── 12. Verify the APK was actually produced ──────────────────────
      - name: Verify APK exists and show size
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            echo "BUILD SUCCESS - APK found:"
            ls -lh "$APK"
          else
            echo "BUILD FAILED - APK not found at expected path"
            find android/app/build -name "*.apk" 2>/dev/null || echo "No APKs found"
            exit 1
          fi

      # ── 13. Upload APK as downloadable artifact (14-day retention) ────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaxiApp-${{ github.event.inputs.version_tag || 'v1.1.4-debug' }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
